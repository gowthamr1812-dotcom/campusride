# ==============================================================================
# CampusRide Enterprise - Production Nginx Reverse Proxy Configuration
# Place at: /etc/nginx/sites-available/campusride.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/campusride.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Rate Limiting Zones (Memory allocated: 10MB per zone)
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_bruteforce_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=telematics_ingest_limit:10m rate=60r/s;

# Upstream Backend Pool
upstream campusride_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# 1. HTTP to HTTPS Redirection (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name campusride.yourdomain.com;

    # Certbot ACME challenge support
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Hardened HTTPS Server (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name campusride.yourdomain.com;

    # SSL Certificates (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/campusride.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campusride.yourdomain.com/privkey.pem;

    # SSL Ciphers & TLS 1.2 / TLS 1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Defense-in-Depth Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Asset Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Single Page Application Frontend
    location / {
        root /var/www/campusride/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Long-Term Cache
    location /assets/ {
        root /var/www/campusride/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # RESTful API Reverse Proxy (with General Rate Limit)
    location /api/ {
        limit_req zone=api_general_limit burst=20 nodelay;

        proxy_pass http://campusride_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Authentication Endpoint Rate Limit (Anti-Brute Force Protection)
    location /api/v1/auth/login {
        limit_req zone=auth_bruteforce_limit burst=5 nodelay;

        proxy_pass http://campusride_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Live GPS Telematics & Notification WebSockets
    location /ws/ {
        proxy_pass http://campusride_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Keep WebSocket connection open for live telematics stream
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
